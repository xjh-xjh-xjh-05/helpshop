server:
  port: 8000
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    active: default
  application:
    name: helpshop-backend
  datasource:
    url: jdbc:h2:file:./data/helpshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: info

security:
  jwt:
    secret: helpshop-demo-jwt-secret-key-for-harmonyos-app-2026
    expiration-seconds: 604800
