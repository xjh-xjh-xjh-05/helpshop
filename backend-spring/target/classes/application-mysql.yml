spring:
  datasource:
    url: jdbc:mysql://${HELP_SHOP_DB_HOST:127.0.0.1}:${HELP_SHOP_DB_PORT:3306}/${HELP_SHOP_DB_NAME:helpshop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${HELP_SHOP_DB_USER:root}
    password: ${HELP_SHOP_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: info
